name: skilllease
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r skilllease/requirements.txt
      - run: PYTHONPATH=. python -m skilllease ci
